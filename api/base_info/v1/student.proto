syntax = "proto3";

package api.base_info.v1;

import "google/api/annotations.proto";
option go_package = "eGZ-stu-log/api/base_info/v1;v1";
option java_multiple_files = true;
option java_package = "api.base_info.v1";

message StuLogItem {
  int64 id = 1;
  string content = 2;
  string time = 3;
  string rule = 4;
  bool invoked = 5;
}

message StudentItem {
  int64 id = 1;
  string name = 2;
  string sex = 3;
  string stuNum = 12;
  int64 classId = 4;
  string className = 10;
  int64 dormId = 5;
  string dormName = 9;
  string dormBuilding = 11;
  int64 gradeId = 6;
  string gradeName = 8;
  string dormPos = 7;
  int32 score = 13;
}

service Student {
  // 学生创建
  rpc CreateStudent (CreateStudentRequest) returns (CreateStudentReply) {
    option (google.api.http) = {
      post: "/v1/base_info/student/create",
      body: "*"
    };
  };
  // 学生查询
  rpc QueryStudent (QueryStudentRequest) returns (QueryStudentReply) {
    option (google.api.http) = {
      get: "/v1/base_info/student/{id}",
    };
  };
  // 学生列表查询
  rpc QueryStudentList (QueryStudentListRequest) returns (QueryStudentListReply) {
    option (google.api.http) = {
      get: "/v1/base_info/student",
    };
  };
}

message CreateStudentRequest {
  string name = 1;
  string sex = 2;
  int64 classId = 3;
  int64 dormId = 4;
  int64 gradeId = 5;
  string dormPos = 6;
  string stuNum = 7;
}
message CreateStudentReply {
  string message = 1;
}
message QueryStudentRequest {
  int64 id = 1;
}
message QueryStudentReply {
  StudentItem student = 1;
}
message QueryStudentListRequest {
  int32 page = 1;
  int32 pageSize = 2;
  optional int64 gradeId = 3;
  optional int64 classId = 4;
}
message QueryStudentListReply {
  repeated StudentItem students = 1;
  int32 totalPages = 2;
}
