syntax = "proto3";

package api.base_info.v1;

import "google/api/annotations.proto";
option go_package = "eGZ-stu-log/api/base_info/v1;v1";
option java_multiple_files = true;
option java_package = "api.base_info.v1";

service Grade {
	rpc CreateGrade (CreateGradeRequest) returns (CreateGradeReply) {
		option (google.api.http) = {
			post: "/v1/base_info/grade/create",
			body: "*"
		};
	}
  rpc GetGrades (GetGradesRequest) returns (GetGradesReply) {
    option (google.api.http) = {
      get: "v1/base_info/grade/list",
    };
  }
}

message CreateGradeRequest {
	string gradeName = 1;
}
message CreateGradeReply {
	string message = 1;
}
message gradeItem {
  int64 id = 1;
  string gradeName = 2;
}
message GetGradesRequest {}
message GetGradesReply {
   repeated gradeItem list = 1;
}